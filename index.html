<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111210" />
    <title>HP-67 Emulator</title>
    <link data-trunk rel="rust" data-bin="hp67emu" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" />
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: rgb(17, 18, 16);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        #the_canvas_id,
        #loading {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: env(safe-area-inset-left, 0px);
            width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        }

        #the_canvas_id {
            outline: none;
        }

        #loading {
            display: grid;
            place-items: center;
            color: #d8d8d8;
            font: 14px system-ui, sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">Loading HP-67 emulator…</div>
    <canvas id="the_canvas_id" tabindex="0"></canvas>
    <script>
        const canvas = document.getElementById("the_canvas_id");
        canvas.addEventListener("focus", () => {
            const loading = document.getElementById("loading");
            if (loading) loading.remove();
        }, { once: true });
        canvas.focus();
    </script>
</body>
</html>
