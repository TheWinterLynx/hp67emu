name: remove-synthetic-hp67-poweron-display-once

on:
  push:
    branches:
      - foundation/cycle-accurate-architecture

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: foundation/cycle-accurate-architecture
          fetch-depth: 0

      - name: Remove synthetic power-on display state
        run: python .github/scripts/remove_synthetic_hp67_poweron_display.py

      - name: Keep display scan count test-local
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/hp67.rs")
          text = path.read_text()
          text = text.replace(
              "        RomFetchEndpoint, HP67_DISPLAY_SCAN_SLOTS, HP67_OBSERVED_POWER_ON_SYNC_DELAY_US,\n",
              "        RomFetchEndpoint, HP67_OBSERVED_POWER_ON_SYNC_DELAY_US,\n",
          )
          anchor = "#[cfg(test)]\nmod tests {\n    use super::*;\n"
          replacement = anchor + "    use hp67emu::machines::hp67::HP67_DISPLAY_SCAN_SLOTS;\n"
          if anchor not in text:
              raise SystemExit("test module anchor not found")
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)

      - name: Format all Rust sources
        run: cargo fmt --all

      - name: Verify rustfmt hard gate
        run: cargo fmt --all -- --check

      - name: Run locked tests with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --all-targets

      - name: Build locked release bins
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo build --locked --release --bins

      - name: Commit validated natural power-on display path
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs
          git commit -m "Remove synthetic HP-67 power-on display frame"
          git push origin HEAD:foundation/cycle-accurate-architecture
