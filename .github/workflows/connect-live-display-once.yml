name: connect-live-display-once

on:
  push:
    branches:
      - foundation/cycle-accurate-architecture

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: foundation/cycle-accurate-architecture
          fetch-depth: 0

      - name: Apply live display integration
        run: python .github/scripts/connect_live_display.py

      - name: Format all Rust sources
        run: cargo fmt --all

      - name: Verify rustfmt
        run: cargo fmt --all -- --check

      - name: Run tests with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --all-targets

      - name: Commit validated live display integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs/files
          git commit -m "Drive UI display from structural HP-67 LEDs"
          git push origin HEAD:foundation/cycle-accurate-architecture
