name: HP-67 PAC library cargo fmt only

on:
  push:
    branches: [agent/hp67-pac-library-complete, agent/hp67-pacs-imported]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Format Rust only
        run: cargo fmt --all
      - name: Verify Rust formatting only
        run: cargo fmt --all -- --check
      - name: Save rustfmt output on feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.rs'
            git commit -m 'Style: apply cargo fmt to HP-67 PAC library'
            git push origin HEAD:${{ github.ref_name }}
          fi
