name: M16L cargo fmt only

on:
  push:
    branches: [agent/m16l-pin-integrity, agent/core-integrity-audit, agent/scheduler-driver-ownership, agent/firmware-trace-validation, agent/media-trace-write-integrity, agent/card-import-integrity, agent/independent-processor-clock, agent/desktop-consolidation, agent/closure-contracts, agent/fabric-owner-provenance, agent/scheduler-fault-boundary, agent/controlled-performance, agent/menu-contextual-help]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Format Rust only
        run: cargo fmt --all
      - name: Verify Rust formatting only
        run: cargo fmt --all -- --check
      - name: Save rustfmt output on feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.rs'
            git commit -m 'Style: apply cargo fmt to integrity audit'
            git push origin HEAD:${{ github.ref_name }}
          fi
