name: M14D rustfmt only

on:
  push:
    branches:
      - agent/m14d-serial-arithmetic-authority

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check rustfmt only
        run: cargo fmt --all -- --check
