name: integrate-shared-word-smoke-once

on:
  push:
    branches:
      - foundation/cycle-accurate-architecture

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: foundation/cycle-accurate-architecture
          fetch-depth: 0

      - name: Integrate shared display-fetch word into power-on smoke
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/bin/hp67_poweron_smoke.rs')
          text = path.read_text()

          old_import = '''    machines::hp67::{
        run_structural_fetch_cycle, structural_display_scan_from_act_registers, ActError,
        ActFetchEndpoint, FetchPipelineLatch, Hp67ArchitecturalError, Hp67ArchitecturalMachine,
        Hp67ElectricalBackplane, Hp67RomWordSource, RomFetchEndpoint,
    },
'''
          new_import = '''    machines::hp67::{
        decode_rom0_display_byte, display_byte_from_act_registers,
        run_structural_display_fetch_cycle, ActError, ActFetchEndpoint, CathodeDriver1820_1749,
        FetchPipelineLatch, Hp67ArchitecturalError, Hp67ArchitecturalMachine,
        Hp67ElectricalBackplane, Hp67RomWordSource, Rom0DisplayEndpoint, RomFetchEndpoint,
        HP67_DISPLAY_SCAN_SLOTS,
    },
'''
          if old_import not in text:
              raise SystemExit('import block target not found')
          text = text.replace(old_import, new_import, 1)

          start = text.index('fn verify_boot_idle_display(')
          end = text.index('\nfn parse_arguments()', start)
          new_verify = r'''fn verify_boot_idle_display<S: Hp67RomWordSource>(
    machine: &Hp67ArchitecturalMachine,
    backplane: &mut Hp67ElectricalBackplane,
    fetch_act: &mut ActFetchEndpoint,
    fetch_rom: &mut RomFetchEndpoint,
    display_rom0: &mut Rom0DisplayEndpoint,
    display_cathode: &mut CathodeDriver1820_1749,
    source: &S,
) -> Result<(), String> {
    // The final RCD edge timing is still unknown. For this deterministic idle
    // checkpoint only, reset the coarse structural scan to slot 1 and freeze
    // the already-reached architectural A/B state while each display byte shares
    // a real 56-bit word transport with a ROM fetch on the same resolved IS net.
    display_cathode.rcd_falling_edge();
    let address = machine.pc();
    let mut codes = Vec::with_capacity(usize::from(HP67_DISPLAY_SCAN_SLOTS));
    let mut segments = Vec::with_capacity(usize::from(HP67_DISPLAY_SCAN_SLOTS));

    for expected_slot in 1..=HP67_DISPLAY_SCAN_SLOTS {
        if display_cathode.scan_slot() != expected_slot {
            return Err(format!(
                "boot display scan phase mismatch: got slot {}, expected {expected_slot}",
                display_cathode.scan_slot()
            ));
        }

        let code = display_byte_from_act_registers(
            expected_slot,
            &machine.act.state.a,
            &machine.act.state.b,
        )
        .map_err(|error| format!("boot display byte composition failed: {error:?}"))?;

        let result = run_structural_display_fetch_cycle(
            backplane,
            address,
            code,
            fetch_act,
            fetch_rom,
            display_rom0,
            source,
        )
        .map_err(|error| {
            format!(
                "boot display shared word failed at scan slot {expected_slot}: {error:?}"
            )
        })?;

        if result.display_byte != code {
            return Err(format!(
                "boot display transport mismatch at slot {expected_slot}: got 0x{:02X}, expected 0x{code:02X}",
                result.display_byte
            ));
        }

        let decoded = decode_rom0_display_byte(expected_slot, result.display_byte)
            .map_err(|error| format!("boot display ROM0 decode failed: {error:?}"))?;
        codes.push(result.display_byte);
        segments.push(decoded.bits());
        display_cathode.str_falling_edge();
    }

    if codes.as_slice() != EXPECTED_BOOT_DISPLAY_CODES {
        return Err(format!(
            "boot display code mismatch: got [{}], expected [{}]",
            format_byte_sequence(&codes),
            format_byte_sequence(&EXPECTED_BOOT_DISPLAY_CODES)
        ));
    }

    if segments.as_slice() != EXPECTED_BOOT_DISPLAY_SEGMENTS {
        return Err(format!(
            "boot display segment mismatch: got [{}], expected [{}]",
            format_byte_sequence(&segments),
            format_byte_sequence(&EXPECTED_BOOT_DISPLAY_SEGMENTS)
        ));
    }

    println!(
        "BOOT DISPLAY PASS: real firmware A/B -> shared resolved IS word cycle (display b0..b7 + fetch b16..b27/b46..b55) -> ROM0 decode -> 15-slot cathode scan produces the source-backed power-on 0.00 pattern."
    );
    println!("BOOT DISPLAY CODES: {}", format_byte_sequence(&codes));
    Ok(())
}
'''
          text = text[:start] + new_verify + text[end:]

          start = text.index('fn fetch_cycle(')
          end = text.index('\nfn print_boot_summary(', start)
          new_fetch = r'''fn fetch_cycle(
    cycle: u64,
    backplane: &mut Hp67ElectricalBackplane,
    machine: &mut Hp67ArchitecturalMachine,
    fetch_act: &mut ActFetchEndpoint,
    fetch_rom: &mut RomFetchEndpoint,
    display_rom0: &mut Rom0DisplayEndpoint,
    display_cathode: &mut CathodeDriver1820_1749,
    pipeline: &mut FetchPipelineLatch,
    source: &CorpusRom<'_>,
    verbose: bool,
) -> Result<(u16, u16), String> {
    let requested_bank = machine.prepare_hp67_fetch();
    source.select_bank(requested_bank);
    let address = machine.pc();
    let scan_slot = display_cathode.scan_slot();
    let display_byte = display_byte_from_act_registers(
        scan_slot,
        &machine.act.state.a,
        &machine.act.state.b,
    )
    .map_err(|error| {
        format!(
            "cycle {cycle} display byte composition failed at scan slot {scan_slot}: {error:?}"
        )
    })?;

    let result = run_structural_display_fetch_cycle(
        backplane,
        address,
        display_byte,
        fetch_act,
        fetch_rom,
        display_rom0,
        source,
    )
    .map_err(|error| format!("cycle {cycle} shared display/fetch word failed: {error:?}"))?;

    if result.display_byte != display_byte {
        return Err(format!(
            "cycle {cycle} display transport mismatch at scan slot {scan_slot}: got 0x{:02X}, expected 0x{display_byte:02X}",
            result.display_byte
        ));
    }

    let fetched = result.fetched_word;
    display_cathode.str_falling_edge();
    pipeline.complete_cycle(fetched);

    if verbose {
        println!(
            "cycle {cycle}: FETCH bank={} pc=0x{address:03x} -> word=0x{fetched:03x} (word_index={})",
            machine.bank(),
            backplane.word_index()
        );
    }
    Ok((address, fetched))
}
'''
          text = text[:start] + new_fetch + text[end:]

          old_decl = '''    let mut fetch_act = ActFetchEndpoint::new(0);
    let mut fetch_rom = RomFetchEndpoint::default();
    let mut pipeline = FetchPipelineLatch::default();
'''
          new_decl = '''    let mut fetch_act = ActFetchEndpoint::new(0);
    let mut fetch_rom = RomFetchEndpoint::default();
    let mut display_rom0 = Rom0DisplayEndpoint::default();
    let mut display_cathode = CathodeDriver1820_1749::default();
    let mut pipeline = FetchPipelineLatch::default();
'''
          if old_decl not in text:
              raise SystemExit('main endpoint declaration target not found')
          text = text.replace(old_decl, new_decl, 1)

          old_path_line = '    println!("fetch path: ACT b16..b27 -> resolved IS -> ROM b46..b55 -> ACT");\n'
          new_path_line = '    println!("word path: ACT display b0..b7 + address b16..b27 -> resolved IS -> ROM b46..b55 -> ACT");\n'
          if old_path_line not in text:
              raise SystemExit('fetch path print target not found')
          text = text.replace(old_path_line, new_path_line, 1)

          old_args = '''            &mut fetch_act,
            &mut fetch_rom,
            &mut pipeline,
'''
          new_args = '''            &mut fetch_act,
            &mut fetch_rom,
            &mut display_rom0,
            &mut display_cathode,
            &mut pipeline,
'''
          count = text.count(old_args)
          if count != 2:
              raise SystemExit(f'expected 2 fetch call targets, found {count}')
          text = text.replace(old_args, new_args)

          old_idle = '                verify_boot_idle_display(&machine)?;\n'
          new_idle = '''                source.select_bank(machine.bank());
                verify_boot_idle_display(
                    &machine,
                    &mut backplane,
                    &mut fetch_act,
                    &mut fetch_rom,
                    &mut display_rom0,
                    &mut display_cathode,
                    &source,
                )?;
'''
          if old_idle not in text:
              raise SystemExit('idle display verification call target not found')
          text = text.replace(old_idle, new_idle, 1)

          old_test = r'''    #[test]
    fn known_power_on_idle_state_passes_structural_display_gate() {
        let mut machine = Hp67ArchitecturalMachine::default();
        machine.act.state.a = [
            0x0, 0x0, 0x1, 0xf, 0xf, 0xf, 0xf, 0xf, 0xf, 0xf, 0x0, 0x0, 0x0, 0x0,
        ];
        machine.act.state.b = [
            0x2, 0x2, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x3, 0x0,
        ];
        verify_boot_idle_display(&machine).expect("known HP-67 idle display must pass");
    }
'''
          new_test = r'''    #[test]
    fn known_power_on_idle_state_passes_shared_word_display_gate() {
        struct ZeroRom;

        impl Hp67RomWordSource for ZeroRom {
            fn read_word(&self, _address: u16) -> Option<u16> {
                Some(0)
            }
        }

        let mut machine = Hp67ArchitecturalMachine::default();
        machine.act.state.a = [
            0x0, 0x0, 0x1, 0xf, 0xf, 0xf, 0xf, 0xf, 0xf, 0xf, 0x0, 0x0, 0x0, 0x0,
        ];
        machine.act.state.b = [
            0x2, 0x2, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0, 0x3, 0x0,
        ];

        let mut backplane = Hp67ElectricalBackplane::default();
        let mut fetch_act = ActFetchEndpoint::new(0);
        let mut fetch_rom = RomFetchEndpoint::default();
        let mut display_rom0 = Rom0DisplayEndpoint::default();
        let mut display_cathode = CathodeDriver1820_1749::default();

        verify_boot_idle_display(
            &machine,
            &mut backplane,
            &mut fetch_act,
            &mut fetch_rom,
            &mut display_rom0,
            &mut display_cathode,
            &ZeroRom,
        )
        .expect("known HP-67 idle display must pass through shared word transport");

        assert_eq!(backplane.word_index(), u64::from(HP67_DISPLAY_SCAN_SLOTS));
        assert_eq!(display_cathode.scan_slot(), 1);
    }
'''
          if old_test not in text:
              raise SystemExit('display gate unit test target not found')
          text = text.replace(old_test, new_test, 1)

          path.write_text(text)

          doc = Path('docs/files/src/bin/hp67_poweron_smoke.rs.md')
          doc.write_text(r'''# `src/bin/hp67_poweron_smoke.rs`

## Purpose

Runs HP-67 power-on firmware from an external normalized 5120-word corpus through one shared structural 56-bit IS word path, continues for thousands of real machine cycles using the independent ACT+CRC architectural composition, and can stop automatically once the firmware has converged into the documented no-key idle loop.

## Why it exists

The project needs a reproducible demonstration that reconciled HP-67 microcode traverses the modeled electrical transport rather than being handed directly to an instruction executor. Instruction fetch and display traffic are both present in the real 56-bit word, so validating them in separate backplanes would leave an artificial fidelity gap. The smoke runner therefore now carries the temporary architectural A/B display-byte bridge at `b0..b7`, the ACT ROM address at `b16..b27`, and the selected-ROM result at `b46..b55` through the same resolved pull-down-biased IS net and the same `Hp67ElectricalBackplane` word coordinate.

## Relationships

Uses `research::rom_corpus::RomCorpus` only as a local firmware loader. Every runtime fetch crosses `Hp67ElectricalBackplane` through `run_structural_display_fetch_cycle`; `FetchPipelineLatch` enforces the one-word pipeline; `Rom0DisplayEndpoint` receives the display byte from the same resolved word; `CathodeDriver1820_1749` provides the current coarse scan slot; and `Hp67ArchitecturalMachine` composes the independent ACT core, temporary architectural RAM and CRC control core. `display_byte_from_act_registers()` remains an explicitly temporary instruction-boundary bridge from A/B state to the eight display bits; it is not the final bit-serial ACT implementation.

## Responsibilities

Require exactly 5120 populated corpus words; preserve the physical startup checkpoints `0x000=0x000`, `0x001=0x3e3`, `0x0f8=0x11a`; honor the HP-67 bank-zero fallback rule; route valid CRC control opcodes without misclassifying them as ACT specials; and continue for `--probe-cycles N` real pipeline cycles. On every real fetch word, reconstruct both the display byte and the ROM result from the same resolved IS transport and hard-fail on disagreement or contention. `--trace-limit N` bounds detailed output. `--stop-at-idle` turns the documented firmware idle path into an automatic convergence criterion and then verifies the source-backed `0.00` display pattern through the combined word transport.

## Implementation

Cycle 0 fills the pipeline, cycles 1..3 verify the directly observed startup sequence, and subsequent cycles execute/fetch continuously. For each fetch, the coarse cathode scan slot selects one A/B register position, `display_byte_from_act_registers()` supplies the temporary eight-bit ACT display bridge, and `run_structural_display_fetch_cycle()` transports display `b0..b7`, address `b16..b27` and ROM result `b46..b55` on one backplane word. The returned display byte must equal the byte observed by ROM0 before the structural cathode slot advances; the returned ROM word is committed to the normal one-word execution pipeline.

`BootMilestones` records source-backed firmware landmarks without embedding ROM contents: octal `0161` (`0x071`) for display initialization, octal `0167` (`0x077`) for the documented main wait-for-key loop, octal `0206` (`0x086`) for the card-present poll, and the directly observed `0x067 -> 0x0fc6` delayed-ROM/JSB flow. Idle convergence requires display initialization, at least two visits to `L0167` with a card-poll pass, `display_enable=true`, and no buffered key. Once that architectural state is reached, the display checkpoint deliberately freezes A/B, applies a structural RCD reset to slot 1, and sends all fifteen source-backed display slots through additional combined display+fetch words on the same backplane. This freeze is a deterministic verification gate, not a claim about final RCD/STR PHI edge timing.

The expected idle codes remain `20 20 01 00 30 00 00 0F 0F 0F 0F 0F 0F 0F 20`, which ROM0 decodes to the power-on `0.00` pattern. Exact ACT bit-serial generation of `b0..b7`, exact PHI launch/sample edges, RCD/STR propagation and LED-current integration remain open fidelity milestones and are not inferred by this runner.
''')

      - name: Format all Rust sources
        run: cargo fmt --all

      - name: Verify rustfmt
        run: cargo fmt --all -- --check

      - name: Run tests with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --all-targets

      - name: Commit validated smoke integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/hp67_poweron_smoke.rs docs/files/src/bin/hp67_poweron_smoke.rs.md
          git commit -m "Run HP-67 smoke over shared display and fetch word"
          git push origin HEAD:foundation/cycle-accurate-architecture
