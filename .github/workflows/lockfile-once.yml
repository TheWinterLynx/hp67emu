name: lockfile-once

on:
  push:
    branches:
      - foundation/cycle-accurate-architecture

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: foundation/cycle-accurate-architecture
          fetch-depth: 0

      - name: Verify rustfmt hard gate
        run: cargo fmt --all -- --check

      - name: Normalize lockfile
        run: cargo generate-lockfile

      - name: Test locked with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --all-targets

      - name: Build locked release bins
        run: cargo build --locked --release --bins

      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already normalized."
            exit 0
          fi
          git commit -m "Normalize Cargo lockfile for locked builds"
          git push origin HEAD:foundation/cycle-accurate-architecture
