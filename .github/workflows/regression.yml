name: regression

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --all-targets
