name: rustfmt-once

on:
  push:
    branches:
      - foundation/cycle-accurate-architecture

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: foundation/cycle-accurate-architecture
          fetch-depth: 0

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Format entire repository
        run: cargo fmt --all

      - name: Verify formatter is clean
        run: cargo fmt --all -- --check

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository already rustfmt-clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Apply rustfmt across Rust sources"
          git push origin HEAD:foundation/cycle-accurate-architecture
