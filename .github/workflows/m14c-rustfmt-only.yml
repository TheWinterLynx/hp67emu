name: M14C rustfmt only

on:
  push:
    branches:
      - agent/m14c-data-authority

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check rustfmt only
        run: cargo fmt --all -- --check
