name: calibrate-hp67-display-geometry-once

on:
  push:
    branches:
      - foundation/cycle-accurate-architecture

permissions:
  contents: write

jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: foundation/cycle-accurate-architecture
          fetch-depth: 0

      - name: Apply physical display calibration
        run: python .github/scripts/calibrate_hp67_display_geometry.py

      - name: Keep module-count helpers test-local
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ui/classic_display.rs')
          text = path.read_text()
          text = text.replace(
              '''const MODULE_COUNT: usize = 3;\nconst CHARACTERS_PER_MODULE: usize = 5;\n''',
              ''
          )
          text = text.replace(
              '''const MODULE_WIDTH_MM: f32 = CHARACTER_PITCH_MM * CHARACTERS_PER_MODULE as f32;\nconst ASSEMBLY_WIDTH_MM: f32 = MODULE_WIDTH_MM * MODULE_COUNT as f32;\n''',
              ''
          )
          text = text.replace(
              '''        assert!((ASSEMBLY_WIDTH_MM - 57.15).abs() < 0.001);\n        assert_eq!(CHARACTER_COUNT, 15);\n        assert_eq!(MODULE_COUNT * CHARACTERS_PER_MODULE, CHARACTER_COUNT);\n''',
              '''        let module_count = 3usize;\n        let characters_per_module = 5usize;\n        let assembly_width_mm =\n            CHARACTER_PITCH_MM * characters_per_module as f32 * module_count as f32;\n        assert!((assembly_width_mm - 57.15).abs() < 0.001);\n        assert_eq!(CHARACTER_COUNT, module_count * characters_per_module);\n'''
          )
          path.write_text(text)
          PY

      - name: Format all Rust sources
        run: cargo fmt --all

      - name: Verify rustfmt hard gate
        run: cargo fmt --all -- --check

      - name: Run locked tests with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --all-targets

      - name: Build locked release bins
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo build --locked --release --bins

      - name: Commit validated physical display calibration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs
          git commit -m "Calibrate HP-67 LED geometry to physical front plane"
          git push origin HEAD:foundation/cycle-accurate-architecture
