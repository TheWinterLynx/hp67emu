name: integrate-act-owned-display-scan-once

on:
  push:
    branches:
      - foundation/cycle-accurate-architecture

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: foundation/cycle-accurate-architecture
          fetch-depth: 0

      - name: Integrate ACT-owned display scan
        run: python .github/scripts/integrate_act_owned_display_scan.py

      - name: Apply const constructor fix
        run: python .github/scripts/fix_act_display_scan_const.py

      - name: Format all Rust sources
        run: cargo fmt --all

      - name: Verify rustfmt hard gate
        run: cargo fmt --all -- --check

      - name: Run locked tests with warnings denied
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --all-targets

      - name: Build locked release bins
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo build --locked --release --bins

      - name: Run real-microcode power-on smoke
        run: ./target/release/hp67_poweron_smoke .research/teenix-2026-hp67.tsv --probe-cycles 100000 --trace-limit 0 --stop-at-idle

      - name: Commit validated ACT display scan ownership
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs
          git commit -m "Make ACT own HP-67 display scan phase"
          git push origin HEAD:foundation/cycle-accurate-architecture
