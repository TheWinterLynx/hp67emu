name: M15X cargo fmt only

on:
  push:
    branches: [agent/m15x-crc-owned-data]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m15x-crc-owned-data
      - name: Format Rust only
        run: cargo fmt --all
      - name: Verify Rust formatting only
        run: cargo fmt --all -- --check
      - name: Save rustfmt output on feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.rs'
            git commit -m 'Style: apply cargo fmt to M15X retained CRC DATA and card transport'
            git push origin HEAD:agent/m15x-crc-owned-data
          fi
